name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Syntax check
        run: python -m compileall providers app.py document_loader.py rag_retriever.py build_rag_index.py voice_Agent.py

      - name: Import smoke test
        run: python -c "import rag_chain, providers.base, providers.google_stt, providers.elevenlabs_tts, providers.ollama_llm; print('imports OK')"
