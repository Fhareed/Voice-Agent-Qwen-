# ── Development setup ───────────────────────────────────────────────────────
# Runs the FastAPI web app in a container and connects it to Ollama running
# NATIVELY on your Mac. On macOS this is the recommended setup: it's much faster
# than running the LLM inside a container (Docker can't use the Mac's GPU), and
# it reuses the Ollama you already installed.
#
# Prerequisites on your machine:
#   1. Ollama running:      ollama serve   (and once:  ollama pull qwen:7b)
#   2. A .env file present with your ELEVEN_API_KEY (see .env.example)
#
# Then just run:   docker compose up --build
# and open:        http://localhost:8000

services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Reach the Ollama running on your host machine, not inside the container.
      OLLAMA_HOST: "http://host.docker.internal:11434"
    extra_hosts:
      # Lets the container resolve the host machine (needed on Linux; harmless on Mac).
      - "host.docker.internal:host-gateway"
    volumes:
      # Live-edit your code without rebuilding the image each time.
      - .:/app
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
